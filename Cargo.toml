[package]
name = "vtdb"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlparser = "0.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
lru = "0.12"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
parquet = "54"
arrow = "54"
object_store = "0.10"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
criterion = "0.5"
reqwest = { version = "0.12", features = ["json"] }
tokio-test = "0.4"
tempfile = "3.10"
lazy_static = "1.4"

