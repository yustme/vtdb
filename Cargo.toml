[package]
name = "vtdb"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlparser = "0.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

[dev-dependencies]
criterion = "0.5"
reqwest = { version = "0.12", features = ["json"] }
tokio-test = "0.4"

