<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTDB - SQL Query Interface</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>VTDB SQL Query Interface</h1>
            <p class="subtitle">Snowflake-Compatible Database Engine</p>
        </header>
        
        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-header">
                    <h2>Tables</h2>
                    <button id="refresh-tables-btn" class="refresh-btn" title="Refresh tables">↻</button>
                </div>
                <div id="tables-list" class="tables-list">
                    <div class="empty-state">
                        <p>No tables found</p>
                    </div>
                </div>
            </div>
            
            <div class="query-section">
                <div class="query-header">
                    <h2>SQL Query</h2>
                    <button id="execute-btn" class="execute-btn">Execute Query</button>
                </div>
                <div id="editor" class="editor"></div>
            </div>
            
            <div class="results-section">
                <h2>Results</h2>
                <div id="results-container">
                    <div class="empty-state">
                        <p>Enter a SQL query and click "Execute Query" to see results</p>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="examples-section">
            <h3>Example Queries</h3>
            <div class="example-queries">
                <button class="example-btn" onclick="loadExample('CREATE TABLE users (id INTEGER, name VARCHAR)')">
                    CREATE TABLE
                </button>
                <button class="example-btn" onclick="loadExample('INSERT INTO users VALUES (1, \\'Alice\\')')">
                    INSERT
                </button>
                <button class="example-btn" onclick="loadExample('SELECT * FROM users')">
                    SELECT ALL
                </button>
                <button class="example-btn" onclick="loadExample('SELECT name FROM users WHERE id = 1')">
                    SELECT WITH WHERE
                </button>
                <button class="example-btn" onclick="loadExample('UPDATE users SET name = \\'Bob Updated\\' WHERE id = 1')">
                    UPDATE
                </button>
                <button class="example-btn" onclick="loadExample('DELETE FROM users WHERE id = 1')">
                    DELETE
                </button>
            </div>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
