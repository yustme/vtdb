<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTDB - SQL Query Interface</title>
    <link rel="stylesheet" href="style.css?v=1765057168">
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>VTDB SQL Query Interface</h1>
            <p class="subtitle">Snowflake-Compatible Database Engine</p>
        </header>
        
        <div class="main-content">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h2>Tables</h2>
                    <button id="refresh-tables-btn" class="refresh-btn" title="Refresh tables">↻</button>
                </div>
                <div id="tables-list" class="tables-list">
                    <div class="empty-state">
                        <p>No tables found</p>
                    </div>
                </div>
                <div id="table-info" class="table-info">
                    <div class="table-info-content">
                        <p class="table-info-placeholder">Click on a table to see its schema</p>
                    </div>
                </div>
            </div>
            
            <div class="resizer" id="resizer"></div>
            
            <div class="query-results-column">
                <div class="query-section">
                    <div class="query-header">
                        <h2>SQL Query</h2>
                        <button id="execute-btn" class="execute-btn">Execute Query</button>
                    </div>
                    <div id="editor" class="editor"></div>
                </div>
                
                <div class="results-section">
                    <h2>Results</h2>
                    <div id="results-container">
                        <div class="empty-state">
                            <p>Enter a SQL query and click "Execute Query" to see results</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="app.js?v=1765057168"></script>
</body>
</html>
